
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 9 · карточки и правописание</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #f6f9fc 0%, #e9f0f8 100%);
      --panel-bg: rgba(255, 255, 255, 0.75);
      --panel-border: rgba(255, 255, 255, 0.6);
      --card-bg: #ffffff;
      --card-border: rgba(255, 255, 255, 0.9);
      --text-primary: #1a2b3e;
      --text-heading: #0f2a44;
      --text-secondary: #3e6a8c;
      --text-muted: #7b96af;
      --accent: #1e4a74;
      --accent-dark: #123a5c;
      --accent-light: #e5eff9;
      --input-border: #d0e0f0;
      --input-bg: #ffffff;
      --tab-bg: rgba(255, 255, 255, 0.6);
      --tab-active: #ffffff;
      --success-bg: #e3f7ee;
      --success-text: #136b45;
      --error-bg: #ffe9e9;
      --error-text: #b13e3e;
      --progress-bg: #e2ecf5;
      --progress-fill: linear-gradient(90deg, #2e9a6b, #4abf8a);
      --shadow-card: 0 30px 45px -18px rgba(12, 40, 70, 0.3);
      --shadow-soft: 0 8px 18px -8px rgba(0, 30, 60, 0.2);
      --row-hover: #f4faff;
    }

    body.dark {
      --bg-gradient: linear-gradient(145deg, #0b1420 0%, #131f2e 100%);
      --panel-bg: rgba(22, 34, 50, 0.8);
      --panel-border: rgba(255, 255, 255, 0.08);
      --card-bg: #1a2838;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #e3ecf5;
      --text-heading: #f0f6fc;
      --text-secondary: #9ec0e0;
      --text-muted: #7a93ab;
      --accent: #5b9bd5;
      --accent-dark: #3d7ab5;
      --accent-light: #24374d;
      --input-border: #2d4055;
      --input-bg: #1f2e40;
      --tab-bg: rgba(255, 255, 255, 0.05);
      --tab-active: #24374d;
      --success-bg: #153a2b;
      --success-text: #6ed4a4;
      --error-bg: #3d1f1f;
      --error-text: #f08c8c;
      --progress-bg: #24374d;
      --progress-fill: linear-gradient(90deg, #4abf8a, #6ed4a4);
      --shadow-card: 0 30px 45px -18px rgba(0, 0, 0, 0.6);
      --shadow-soft: 0 8px 18px -8px rgba(0, 0, 0, 0.5);
      --row-hover: #22334a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--text-primary);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .app-wrapper {
      max-width: 1000px;
      width: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 3rem;
      box-shadow: 0 25px 50px -12px rgba(0, 20, 40, 0.25), 0 0 0 1px var(--panel-border) inset;
      padding: 2rem 2rem 2.5rem;
      transition: all 0.3s ease;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-heading);
      padding-left: 0.25rem;
    }

    h1 i {
      background: var(--accent);
      color: white;
      font-size: 1.5rem;
      width: 2.8rem;
      height: 2.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 1.2rem;
      box-shadow: 0 8px 18px -6px rgba(28, 78, 128, 0.4);
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      width: 3rem;
      height: 3rem;
      border-radius: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--accent);
      box-shadow: var(--shadow-soft);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .theme-toggle:hover { transform: translateY(-2px); background: var(--accent-light); }

    .progress-section {
      margin-bottom: 1.8rem;
      background: var(--card-bg);
      border-radius: 1.5rem;
      padding: 1.2rem 1.5rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--panel-border);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.7rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .progress-header .level-badge { display: flex; align-items: center; gap: 0.4rem; color: var(--accent); }

    .progress-track {
      width: 100%; height: 12px;
      background: var(--progress-bg);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--progress-fill);
      border-radius: 100px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      background: var(--tab-bg);
      padding: 0.5rem;
      border-radius: 100px;
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow-soft);
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem 1rem;
      border-radius: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }

    .mode-btn.active {
      background: var(--tab-active);
      color: var(--text-heading);
      box-shadow: var(--shadow-soft);
    }

    .mode-btn:not(.active):hover { background: var(--accent-light); color: var(--accent); }

    /* Карточки */
    .card-area { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 380px; }

    .flashcard {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border-radius: 2.5rem;
      box-shadow: var(--shadow-card);
      padding: 2.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease;
      margin-bottom: 1.8rem;
      border: 1px solid var(--card-border);
      position: relative;
    }

    .flashcard:hover { transform: scale(1.01); }

    .mastered-badge {
      position: absolute;
      top: 1.2rem;
      right: 1.5rem;
      background: var(--success-bg);
      color: var(--success-text);
      padding: 0.35rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .word-en {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-heading);
      margin-bottom: 1.2rem;
      line-height: 1.2;
      word-break: break-word;
    }

    .word-ru {
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      padding-top: 0.5rem;
      border-top: 2px dashed var(--input-border);
      display: inline-block;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    .hint-small {
      margin-top: 1.2rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      width: 3.5rem; height: 3.5rem;
      border-radius: 2rem;
      font-size: 1.4rem;
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: all 0.15s ease;
    }

    .nav-btn:hover { background: var(--accent-light); transform: translateY(-2px); }

    .mark-btn {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      padding: 0.85rem 1.5rem;
      border-radius: 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      display: flex; align-items: center; gap: 0.5rem;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
    }

    .mark-btn:hover { background: var(--accent-light); transform: translateY(-2px); }
    .mark-btn.mastered { background: var(--success-bg); color: var(--success-text); border-color: transparent; }

    .progress-badge {
      background: var(--card-bg);
      padding: 0.7rem 1.4rem;
      border-radius: 3rem;
      font-weight: 600;
      color: var(--accent);
      box-shadow: var(--shadow-soft);
      font-size: 1rem;
      border: 1px solid var(--panel-border);
      min-width: 100px;
      text-align: center;
    }

    .shuffle-btn {
      background: var(--accent-light);
      border: 1px solid var(--panel-border);
      padding: 0.9rem 1.8rem;
      border-radius: 3rem;
      font-weight: 600;
      color: var(--accent);
      display: flex; align-items: center; gap: 0.6rem;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: var(--shadow-soft);
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
    }

    .shuffle-btn:hover { background: var(--accent); color: white; transform: translateY(-2px); }

    /* Правописание */
    .spelling-area { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 380px; }

    .prompt-box {
      background: var(--card-bg);
      border-radius: 2.5rem;
      box-shadow: var(--shadow-card);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 620px;
      text-align: center;
      margin-bottom: 1.8rem;
      border: 1px solid var(--card-border);
    }

    .prompt-ru {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1.2rem;
    }

    .prompt-hint {
      font-size: 1rem;
      color: var(--text-muted);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: var(--accent-light);
      padding: 0.5rem 1.2rem;
      border-radius: 3rem;
      width: fit-content;
      margin: 0 auto;
    }

    .input-group { display: flex; flex-direction: column; align-items: center; gap: 1rem; width: 100%; max-width: 620px; }

    .spell-input {
      width: 100%;
      padding: 1.2rem 1.8rem;
      font-size: 1.3rem;
      border-radius: 4rem;
      border: 2px solid var(--input-border);
      background: var(--input-bg);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: var(--text-heading);
      transition: all 0.2s ease;
      outline: none;
      box-shadow: var(--shadow-soft);
    }

    .spell-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47, 110, 160, 0.15); }
    .spell-input.correct { border-color: #2e9a6b; background: var(--success-bg); }
    .spell-input.incorrect { border-color: #d95b5b; background: var(--error-bg); }

    .action-row { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; width: 100%; }

    .btn-primary {
      background: var(--accent);
      border: none;
      padding: 1rem 2.2rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1.05rem;
      color: white;
      display: flex; align-items: center; gap: 0.6rem;
      cursor: pointer;
      box-shadow: 0 14px 24px -10px rgba(20, 60, 100, 0.5);
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary:hover { background: var(--accent-dark); transform: translateY(-1px); }

    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--input-border);
      padding: 1rem 2rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--accent);
      display: flex; align-items: center; gap: 0.6rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
      box-shadow: var(--shadow-soft);
    }

    .btn-secondary:hover { background: var(--accent-light); transform: translateY(-1px); }

    .feedback {
      margin-top: 0.5rem;
      font-weight: 500;
      font-size: 1.05rem;
      min-height: 2.5rem;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      padding: 0.5rem 1.2rem;
      border-radius: 3rem;
      width: fit-content;
      margin-left: auto; margin-right: auto;
    }

    .feedback.success { background: var(--success-bg); color: var(--success-text); }
    .feedback.error { background: var(--error-bg); color: var(--error-text); }

    /* ===== СПИСОК ВСЕХ СЛОВ ===== */
    .list-area {
      min-height: 380px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .list-toolbar {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: center;
      background: var(--card-bg);
      padding: 1rem 1.2rem;
      border-radius: 1.5rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--panel-border);
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.6rem;
      border-radius: 3rem;
      border: 2px solid var(--input-border);
      background: var(--input-bg);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: var(--text-heading);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus { border-color: var(--accent); }

    .filter-group {
      display: flex;
      gap: 0.4rem;
      background: var(--accent-light);
      padding: 0.3rem;
      border-radius: 3rem;
    }

    .filter-btn {
      border: none;
      background: transparent;
      padding: 0.6rem 1.1rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: var(--card-bg);
      color: var(--accent);
      box-shadow: var(--shadow-soft);
    }

    .words-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 0.4rem;
    }

    .words-list::-webkit-scrollbar { width: 8px; }
    .words-list::-webkit-scrollbar-track { background: transparent; }
    .words-list::-webkit-scrollbar-thumb {
      background: var(--input-border);
      border-radius: 10px;
    }
    .words-list::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .word-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.4rem;
      background: var(--card-bg);
      border-radius: 1.5rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--panel-border);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .word-row:hover {
      background: var(--row-hover);
      transform: translateX(4px);
    }

    .word-row.mastered {
      background: var(--success-bg);
      border-color: transparent;
    }

    .word-row.mastered .row-en { color: var(--success-text); }

    .row-check {
      width: 1.8rem;
      height: 1.8rem;
      border-radius: 0.6rem;
      border: 2px solid var(--input-border);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
      color: transparent;
      font-size: 0.85rem;
    }

    .word-row.mastered .row-check {
      background: #2e9a6b;
      border-color: #2e9a6b;
      color: white;
    }

    .row-content { flex: 1; min-width: 0; }

    .row-en {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-heading);
      margin-bottom: 0.2rem;
      word-break: break-word;
    }

    .row-ru {
      font-size: 0.95rem;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .row-speak {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      border: none;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .row-speak:hover { background: var(--accent); color: white; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

    .hidden { display: none !important; }

    .reset-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 0.5rem;
      font-family: 'Inter', sans-serif;
    }

    .reset-btn:hover { color: var(--error-text); }

    @media (max-width: 600px) {
      .app-wrapper { padding: 1.5rem 1.2rem 2rem; border-radius: 2rem; }
      h1 { font-size: 1.4rem; }
      h1 i { width: 2.2rem; height: 2.2rem; font-size: 1.1rem; }
      .theme-toggle { width: 2.6rem; height: 2.6rem; font-size: 1rem; }
      .mode-btn { font-size: 0.85rem; padding: 0.7rem 0.4rem; gap: 0.3rem; }
      .mode-btn i { font-size: 0.9rem; }
      .word-en { font-size: 2.2rem; }
      .word-ru { font-size: 1.4rem; }
      .prompt-ru { font-size: 1.9rem; }
      .spell-input { font-size: 1.05rem; padding: 1rem 1.4rem; }
      .flashcard, .prompt-box { padding: 2rem 1.2rem; }
      .nav-btn { width: 3rem; height: 3rem; font-size: 1.2rem; }
      .btn-primary, .btn-secondary { padding: 0.85rem 1.5rem; font-size: 0.95rem; }
      .mark-btn { padding: 0.7rem 1rem; font-size: 0.85rem; }
      .row-en { font-size: 1rem; }
      .row-ru { font-size: 0.85rem; }
      .word-row { padding: 0.85rem 1rem; gap: 0.7rem; }
      .filter-btn { font-size: 0.8rem; padding: 0.5rem 0.8rem; }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="top-bar">
    <h1><i class="fas fa-boxes"></i> Unit 9</h1>
    <button class="theme-toggle" id="themeToggle" title="Сменить тему">
      <i class="fas fa-moon"></i>
    </button>
  </div>

  <!-- Прогресс -->
  <div class="progress-section">
    <div class="progress-header">
      <span class="level-badge">
        <i class="fas fa-graduation-cap"></i>
        <span id="levelText">Уровень 1 · Новичок</span>
      </span>
      <span id="masteredText">0 / 34 выучено</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
    </div>
    <button class="reset-btn" id="resetProgress">Сбросить прогресс</button>
  </div>

  <!-- Табы -->
  <div class="mode-tabs">
    <button class="mode-btn active" id="tabCards"><i class="fas fa-layer-group"></i> Карточки</button>
    <button class="mode-btn" id="tabSpelling"><i class="fas fa-keyboard"></i> Правописание</button>
    <button class="mode-btn" id="tabList"><i class="fas fa-list"></i> Все слова</button>
  </div>

  <!-- Карточки -->
  <div id="cardsPanel" class="card-area">
    <div class="flashcard" id="flashcard">
      <div class="mastered-badge hidden" id="masteredBadge">
        <i class="fas fa-check-circle"></i> Выучено
      </div>
      <div class="word-en" id="cardWordEn">appropriate</div>
      <div class="word-ru" id="cardWordRu">подходящий</div>
      <div class="hint-small"><i class="fas fa-sync-alt"></i> нажми, чтобы перевернуть</div>
    </div>
    <div class="controls">
      <button class="nav-btn" id="prevCard"><i class="fas fa-chevron-left"></i></button>
      <span class="progress-badge" id="cardCounter">1 / 34</span>
      <button class="nav-btn" id="nextCard"><i class="fas fa-chevron-right"></i></button>
      <button class="mark-btn" id="markMastered"><i class="fas fa-check"></i> Отметить</button>
      <button class="shuffle-btn" id="shuffleCards"><i class="fas fa-random"></i> Перемешать</button>
    </div>
  </div>

  <!-- Правописание -->
  <div id="spellingPanel" class="spelling-area hidden">
    <div class="prompt-box">
      <div class="prompt-ru" id="spellPromptRu">подходящий</div>
      <div class="prompt-hint"><i class="fas fa-arrow-right"></i> введите слово на английском</div>
    </div>
    <div class="input-group">
      <input type="text" class="spell-input" id="spellInput" placeholder="например: appropriate" autocomplete="off" spellcheck="false">
      <div class="action-row">
        <button class="btn-primary" id="checkSpell"><i class="fas fa-check-circle"></i> Проверить</button>
        <button class="btn-secondary" id="nextSpell"><i class="fas fa-forward"></i> Пропустить</button>
      </div>
      <div id="spellFeedback" class="feedback"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <span class="progress-badge" id="spellCounter">1 / 34</span>
        <button class="btn-secondary" id="shuffleSpell" style="padding: 0.5rem 1.2rem; font-size: 0.9rem;"><i class="fas fa-random"></i> Перемешать</button>
      </div>
    </div>
  </div>

  <!-- ВСЕ СЛОВА -->
  <div id="listPanel" class="list-area hidden">
    <div class="list-toolbar">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" class="search-input" id="searchInput" placeholder="Поиск по слову или переводу...">
      </div>
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="mastered">Выучено</button>
        <button class="filter-btn" data-filter="learning">Учу</button>
      </div>
    </div>

    <div class="words-list" id="wordsList"></div>
  </div>
</div>

<script>
  // ----- Данные -----
  const wordPairs = [
    { en: "appropriate", ru: "подходящий" },
    { en: "average", ru: "средний" },
    { en: "bill", ru: "счёт" },
    { en: "breathtaking", ru: "захватывающий" },
    { en: "challenge", ru: "вызов (или испытание)" },
    { en: "client", ru: "клиент" },
    { en: "component", ru: "деталь (или компонент)" },
    { en: "container", ru: "контейнер" },
    { en: "courier", ru: "курьер" },
    { en: "demand", ru: "спрос" },
    { en: "dispatch", ru: "отправлять" },
    { en: "distribute", ru: "распространять (или распределять)" },
    { en: "distributor", ru: "дистрибьютор (или распространитель)" },
    { en: "enormous", ru: "огромный" },
    { en: "home improvement", ru: "благоустройство (или ремонт)" },
    { en: "in stock", ru: "в наличии" },
    { en: "inventory", ru: "запасы" },
    { en: "keep track of", ru: "отслеживать" },
    { en: "manufacturer", ru: "производитель (или изготовитель)" },
    { en: "motherboard", ru: "материнская плата" },
    { en: "out of stock", ru: "распродано (или отсутствует)" },
    { en: "performance", ru: "производительность (или результативность)" },
    { en: "raw material", ru: "сырьё" },
    { en: "retailer", ru: "ритейлер (или розничник)" },
    { en: "run low on", ru: "иссякать" },
    { en: "run out of", ru: "заканчиваться" },
    { en: "solution", ru: "решение" },
    { en: "stock up on", ru: "запасаться" },
    { en: "streamlined", ru: "оптимизированный" },
    { en: "supplier", ru: "поставщик" },
    { en: "supply chain", ru: "цепочка поставок (или снабжение)" },
    { en: "ultimately", ru: "в итоге (или окончательно)" },
    { en: "urgently", ru: "срочно" },
    { en: "warehouse", ru: "склад" }
  ];

  // ----- Состояние -----
  let cardOrder = [...wordPairs];
  let currentCardIndex = 0;
  let isFlipped = false;

  let spellOrder = [...wordPairs];
  let currentSpellIndex = 0;

  let masteredWords = new Set(JSON.parse(localStorage.getItem('unit9_mastered') || '[]'));
  let isDark = localStorage.getItem('unit9_theme') === 'dark';

  let currentFilter = 'all';
  let currentSearch = '';

  // ----- DOM -----
  const flashcard = document.getElementById('flashcard');
  const cardWordEn = document.getElementById('cardWordEn');
  const cardWordRu = document.getElementById('cardWordRu');
  const cardCounter = document.getElementById('cardCounter');
  const prevBtn = document.getElementById('prevCard');
  const nextBtn = document.getElementById('nextCard');
  const shuffleCardsBtn = document.getElementById('shuffleCards');
  const markMasteredBtn = document.getElementById('markMastered');
  const masteredBadge = document.getElementById('masteredBadge');

  const spellPromptRu = document.getElementById('spellPromptRu');
  const spellInput = document.getElementById('spellInput');
  const checkSpellBtn = document.getElementById('checkSpell');
  const nextSpellBtn = document.getElementById('nextSpell');
  const spellFeedback = document.getElementById('spellFeedback');
  const spellCounter = document.getElementById('spellCounter');
  const shuffleSpellBtn = document.getElementById('shuffleSpell');

  const tabCards = document.getElementById('tabCards');
  const tabSpelling = document.getElementById('tabSpelling');
  const tabList = document.getElementById('tabList');
  const cardsPanel = document.getElementById('cardsPanel');
  const spellingPanel = document.getElementById('spellingPanel');
  const listPanel = document.getElementById('listPanel');

  const wordsList = document.getElementById('wordsList');
  const searchInput = document.getElementById('searchInput');
  const filterBtns = document.querySelectorAll('.filter-btn');

  const progressFill = document.getElementById('progressFill');
  const masteredText = document.getElementById('masteredText');
  const levelText = document.getElementById('levelText');
  const resetProgressBtn = document.getElementById('resetProgress');
  const themeToggle = document.getElementById('themeToggle');

  // ----- Тема -----
  function applyTheme() {
    if (isDark) {
      document.body.classList.add('dark');
      themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
    } else {
      document.body.classList.remove('dark');
      themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
    }
  }

  themeToggle.addEventListener('click', () => {
    isDark = !isDark;
    localStorage.setItem('unit9_theme', isDark ? 'dark' : 'light');
    applyTheme();
  });

  // ----- Прогресс -----
  function updateProgress() {
    const total = wordPairs.length;
    const done = masteredWords.size;
    const percent = Math.round((done / total) * 100);
    progressFill.style.width = percent + '%';
    masteredText.textContent = `${done} / ${total} выучено`;

    let level, levelName;
    if (percent < 25) { level = 1; levelName = 'Новичок'; }
    else if (percent < 50) { level = 2; levelName = 'Ученик'; }
    else if (percent < 75) { level = 3; levelName = 'Знаток'; }
    else if (percent < 100) { level = 4; levelName = 'Эксперт'; }
    else { level = 5; levelName = 'Мастер'; }

    levelText.textContent = `Уровень ${level} · ${levelName}`;
  }

  function saveMastered() {
    localStorage.setItem('unit9_mastered', JSON.stringify([...masteredWords]));
    updateProgress();
    if (!listPanel.classList.contains('hidden')) renderWordList();
  }

  function updateMasteredBadge() {
    const pair = cardOrder[currentCardIndex];
    if (!pair) return;
    if (masteredWords.has(pair.en)) {
      masteredBadge.classList.remove('hidden');
      markMasteredBtn.classList.add('mastered');
      markMasteredBtn.innerHTML = '<i class="fas fa-check-circle"></i> Выучено';
    } else {
      masteredBadge.classList.add('hidden');
      markMasteredBtn.classList.remove('mastered');
      markMasteredBtn.innerHTML = '<i class="fas fa-check"></i> Отметить';
    }
  }

  function toggleMastered() {
    const pair = cardOrder[currentCardIndex];
    if (!pair) return;
    if (masteredWords.has(pair.en)) masteredWords.delete(pair.en);
    else masteredWords.add(pair.en);
    saveMastered();
    updateMasteredBadge();
  }

  resetProgressBtn.addEventListener('click', () => {
    if (confirm('Сбросить весь прогресс? Все отметки «выучено» будут удалены.')) {
      masteredWords.clear();
      saveMastered();
      updateMasteredBadge();
    }
  });

  // ----- Карточки -----
  function updateCardDisplay() {
    const pair = cardOrder[currentCardIndex];
    if (!pair) return;
    if (isFlipped) {
      cardWordEn.textContent = pair.ru;
      cardWordRu.textContent = pair.en;
    } else {
      cardWordEn.textContent = pair.en;
      cardWordRu.textContent = pair.ru;
    }
    cardCounter.textContent = `${currentCardIndex + 1} / ${cardOrder.length}`;
    updateMasteredBadge();
  }

  function flipCard() { isFlipped = !isFlipped; updateCardDisplay(); }
  function nextCard() { currentCardIndex = (currentCardIndex + 1) % cardOrder.length; isFlipped = false; updateCardDisplay(); }
  function prevCard() { currentCardIndex = (currentCardIndex - 1 + cardOrder.length) % cardOrder.length; isFlipped = false; updateCardDisplay(); }

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function shuffleCards() {
    cardOrder = shuffleArray(wordPairs);
    currentCardIndex = 0;
    isFlipped = false;
    updateCardDisplay();
  }

  // ----- Правописание -----
  function updateSpellDisplay() {
    const pair = spellOrder[currentSpellIndex];
    if (!pair) return;
    spellPromptRu.textContent = pair.ru;
    spellCounter.textContent = `${currentSpellIndex + 1} / ${spellOrder.length}`;
    spellInput.value = '';
    spellInput.classList.remove('correct', 'incorrect');
    spellFeedback.textContent = '';
    spellFeedback.className = 'feedback';
    spellInput.focus();
  }

  function checkSpelling() {
    const pair = spellOrder[currentSpellIndex];
    if (!pair) return;
    const userAnswer = spellInput.value.trim().toLowerCase();
    const correctAnswer = pair.en.toLowerCase();

    if (userAnswer === correctAnswer) {
      spellInput.classList.add('correct');
      spellInput.classList.remove('incorrect');
      spellFeedback.innerHTML = '<i class="fas fa-check-circle"></i> Верно! Отлично!';
      spellFeedback.className = 'feedback success';
      if (!masteredWords.has(pair.en)) {
        masteredWords.add(pair.en);
        saveMastered();
      }
    } else {
      spellInput.classList.add('incorrect');
      spellInput.classList.remove('correct');
      spellFeedback.innerHTML = `<i class="fas fa-times-circle"></i> Ошибка. Правильно: <strong>${pair.en}</strong>`;
      spellFeedback.className = 'feedback error';
    }
  }

  function nextSpellWord() { currentSpellIndex = (currentSpellIndex + 1) % spellOrder.length; updateSpellDisplay(); }
  function shuffleSpell() { spellOrder = shuffleArray(wordPairs); currentSpellIndex = 0; updateSpellDisplay(); }

  // ----- СПИСОК ВСЕХ СЛОВ -----
  function renderWordList() {
    const filtered = wordPairs.filter(pair => {
      const matchesSearch = currentSearch === '' ||
        pair.en.toLowerCase().includes(currentSearch) ||
        pair.ru.toLowerCase().includes(currentSearch);

      const isMastered = masteredWords.has(pair.en);
      let matchesFilter = true;
      if (currentFilter === 'mastered') matchesFilter = isMastered;
      else if (currentFilter === 'learning') matchesFilter = !isMastered;

      return matchesSearch && matchesFilter;
    });

    if (filtered.length === 0) {
      wordsList.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-search"></i>
          <p>Ничего не найдено</p>
        </div>
      `;
      return;
    }

    wordsList.innerHTML = filtered.map(pair => {
      const isMastered = masteredWords.has(pair.en);
      return `
        <div class="word-row ${isMastered ? 'mastered' : ''}" data-en="${pair.en.replace(/"/g, '&quot;')}">
          <div class="row-check"><i class="fas fa-check"></i></div>
          <div class="row-content">
            <div class="row-en">${pair.en}</div>
            <div class="row-ru">${pair.ru}</div>
          </div>
          <button class="row-speak" title="Произнести" data-speak="${pair.en.replace(/"/g, '&quot;')}">
            <i class="fas fa-volume-up"></i>
          </button>
        </div>
      `;
    }).join('');

    // Обработчики строк
    wordsList.querySelectorAll('.word-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('.row-speak')) return;
        const en = row.dataset.en;
        if (masteredWords.has(en)) masteredWords.delete(en);
        else masteredWords.add(en);
        saveMastered();
        renderWordList();
      });
    });

    // Озвучка
    wordsList.querySelectorAll('.row-speak').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        speakWord(btn.dataset.speak);
      });
    });
  }

  function speakWord(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  }

  // Поиск
  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value.trim().toLowerCase();
    renderWordList();
  });

  // Фильтры
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderWordList();
    });
  });

  // ----- Переключение панелей -----
  function setActiveTab(mode) {
    [tabCards, tabSpelling, tabList].forEach(t => t.classList.remove('active'));
    [cardsPanel, spellingPanel, listPanel].forEach(p => p.classList.add('hidden'));

    if (mode === 'cards') {
      tabCards.classList.add('active');
      cardsPanel.classList.remove('hidden');
      updateCardDisplay();
    } else if (mode === 'spelling') {
      tabSpelling.classList.add('active');
      spellingPanel.classList.remove('hidden');
      updateSpellDisplay();
    } else if (mode === 'list') {
      tabList.classList.add('active');
      listPanel.classList.remove('hidden');
      renderWordList();
    }
  }

  // ----- Инициализация -----
  document.addEventListener('DOMContentLoaded', () => {
    applyTheme();
    updateProgress();
    updateCardDisplay();

    flashcard.addEventListener('click', flipCard);
    nextBtn.addEventListener('click', nextCard);
    prevBtn.addEventListener('click', prevCard);
    shuffleCardsBtn.addEventListener('click', shuffleCards);
    markMasteredBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMastered();
    });

    checkSpellBtn.addEventListener('click', checkSpelling);
    nextSpellBtn.addEventListener('click', nextSpellWord);
    shuffleSpellBtn.addEventListener('click', shuffleSpell);

    spellInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        checkSpelling();
      }
    });

    tabCards.addEventListener('click', () => setActiveTab('cards'));
    tabSpelling.addEventListener('click', () => setActiveTab('spelling'));
    tabList.addEventListener('click', () => setActiveTab('list'));

    document.addEventListener('keydown', (e) => {
      if (!cardsPanel.classList.contains('hidden')) {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextCard(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevCard(); }
        else if (e.key === ' ') { e.preventDefault(); flipCard(); }
      }
    });

    setActiveTab('cards');
  });
</script>
</body>
</html>
